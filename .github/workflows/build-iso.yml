name: Build macOS ISO

on:
  workflow_dispatch:
    inputs:
      os_version:
        description: 'Version de macOS (ex: 15.0, 15.1, 14.7)'
        required: true
        default: '15'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Installer mist-cli
        run: |
          brew install mist-cli

      - name: Télécharger l'installateur complet macOS
        run: |
          echo "Recherche et téléchargement de l'installateur macOS ${{ github.event.inputs.os_version }} via Mist..."
          # Télécharge l'application d'installation directement dans /Applications
          sudo mist download installer "${{ github.event.inputs.os_version }}" application -o /Applications
          
          APP_PATH=$(find /Applications -maxdepth 1 -name "Install macOS*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Erreur : installateur introuvable après le téléchargement."
            exit 1
          fi
          echo "Installateur présent dans : $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Créer le conteneur disque temporaire
        run: |
          hdiutil create -o /tmp/macOS -size 16384m -volname macos -layout SPUD -fs HFS+J
          hdiutil attach /tmp/macOS.dmg -noverify -mountpoint /Volumes/macos

      - name: Générer le média d'installation
        run: |
          sudo "$APP_PATH/Contents/Resources/createinstallmedia" --volume /Volumes/macos --nointeraction

      - name: Convertir en ISO
        run: |
          hdiutil detach /Volumes/Install*
          hdiutil convert /tmp/macOS.dmg -format UDTO -o ./macos.cdr
          mv ./macos.cdr ./macos.iso
          ls -lh ./macos.iso

      - name: Uploader l'ISO en Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ github.event.inputs.os_version }}-ISO
          path: ./macos.iso
          retention-days: 1
